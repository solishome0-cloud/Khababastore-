<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKY BOOKS ONLINE STORE</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1200px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .admin-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.1);
        }

        .admin-btn:hover {
            background: var(--accent);
            color: var(--primary);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 50px;
            transform-style: preserve-3d;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .hero p {
            color: #94a3b8;
            font-size: 18px;
        }

        /* 3D Book Grid Layout */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 35px;
            padding: 20px 0;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-card:hover {
            transform: translateY(-10px) rotateX(5deg) rotateY(5deg);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        0 0 25px var(--accent-glow);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .book-img-container {
            width: 100%;
            height: 220px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .book-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .book-card:hover .book-img-container img {
            transform: scale(1.08);
        }

        .book-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .book-price {
            font-size: 18px;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .buy-btn:hover {
            background: linear-gradient(135deg, #7dd3fc, #38bdf8);
            box-shadow: 0 6px 20px var(--accent-glow);
            transform: scale(1.02);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 17, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            position: relative;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--text-color);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .submit-admin-btn {
            width: 100%;
            background: var(--accent);
            color: var(--primary);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .submit-admin-btn:hover {
            background: #7dd3fc;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: #64748b;
            font-size: 18px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SKY BOOKS</div>
        <button class="admin-btn" onclick="openAdminModal()">Admin Panel</button>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Explore Next-Gen Literature</h1>
            <p>Immerse yourself in our immersive 3D digital bookshelf</p>
        </div>

        <div class="books-grid" id="booksGrid">
            <!-- Dynamic Books Will Load Here -->
        </div>
    </div>

    <!-- Admin Login / Add Book Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAdminModal()">&times;</span>
            <div id="authSection">
                <h2>Admin Authentication</h2>
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="adminPasswordInput" placeholder="Enter password...">
                </div>
                <button class="submit-admin-btn" onclick="verifyAdmin()">Login</button>
            </div>

            <div id="bookAddSection" style="display: none;">
                <h2>Add New Book</h2>
                <div class="form-group">
                    <label>Book Name</label>
                    <input type="text" id="bookName" placeholder="Enter book title...">
                </div>
                <div class="form-group">
                    <label>Price ($)</label>
                    <input type="number" id="bookPrice" placeholder="Enter price...">
                </div>
                <div class="form-group">
                    <label>Book Picture (Local File)</label>
                    <input type="file" id="bookImageFile" accept="image/*">
                </div>
                <button class="submit-admin-btn" onclick="addNewBook()">Publish Book</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "mardan332211";
        const ADMIN_EMAIL = "solishome0@gmail.com";

        // Load existing books from local storage or set default demo books
        let books = JSON.parse(localStorage.getItem('sky_books')) || [];

        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';

            if (books.length === 0) {
                grid.innerHTML = `<div class="empty-state">No books available yet. Admins can log in to add books!</div>`;
                return;
            }

            books.forEach((book, index) => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div>
                        <div class="book-img-container">
                            <img src="${book.image}" alt="${book.name}">
                        </div>
                        <div class="book-info">
                            <h3>${escapeHtml(book.name)}</h3>
                            <div class="book-price">$${escapeHtml(book.price)}</div>
                        </div>
                    </div>
                    <button class="buy-btn" onclick="buyBook('${escapeHtml(book.name)}', '${escapeHtml(book.price)}')">Buy Now</button>
                `;
                grid.appendChild(card);
            });
        }

        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
            // Reset view
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('bookAddSection').style.display = 'none';
            document.getElementById('adminPasswordInput').value = '';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('bookAddSection').style.display = 'block';
            } else {
                alert('Incorrect Admin Password!');
            }
        }

        function addNewBook() {
            const name = document.getElementById('bookName').value.trim();
            const price = document.getElementById('bookPrice').value.trim();
            const fileInput = document.getElementById('bookImageFile');

            if (!name || !price || fileInput.files.length === 0) {
                alert('Please fill out all fields and select an image file.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;
                books.push({ name, price, image: imageData });
                localStorage.setItem('sky_books', JSON.stringify(books));
                renderBooks();
                closeAdminModal();
                
                // Clear inputs
                document.getElementById('bookName').value = '';
                document.getElementById('bookPrice').value = '';
                fileInput.value = '';
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function buyBook(bookName, bookPrice) {
            const subject = encodeURIComponent(`Delivery Request for: ${bookName}`);
            const body = encodeURIComponent(`Hello Admin,\n\nI want to buy the following book:\n\nBook Name: ${bookName}\nPrice: $${bookPrice}\n\nPlease proceed with my delivery request.\n\nThank you!`);
            
            window.location.href = `mailto:${ADMIN_EMAIL}?subject=${subject}&body=${body}`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize grid on load
        window.onload = renderBooks;
    </script>
</body>
</html>
